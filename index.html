<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRASES CLAVE DEL SECTOR | XPAÑOL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Special Elite',cursive;
}

body{
    min-height:100vh;
    background:#7c3aed;
    color:white;
    padding:40px 30px 70px;
    position:relative;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    pointer-events:none;
    z-index:0;
}

.back,.header,.grid{
    position:relative;
    z-index:1;
}

.back{
    display:inline-block;
    color:white;
    text-decoration:none;
    font-size:.85rem;
    letter-spacing:1.5px;
    opacity:.8;
    margin-bottom:35px;
}

.back:hover{ opacity:1; }

.header{
    text-align:center;
    margin-bottom:60px;
}

.header h1{
    font-size:3.5rem;
    margin-bottom:12px;
    letter-spacing:2px;
}

.header .en-title{
    font-size:1.4rem;
    letter-spacing:3px;
    margin-bottom:15px;
}

.subtitle{
    opacity:.9;
    font-size:1rem;
}

.grid{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

.card{
    background:white;
    color:#111;
    text-decoration:none;
    border-radius:24px;
    min-height:200px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:34px 26px 28px;
    transition:.25s;
    box-shadow:0 15px 35px rgba(0,0,0,.18);
    position:relative;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 25px 45px rgba(0,0,0,.25);
}

/* EFECTO AL HACER CLIC: fondo morado y texto blanco */
.card:active,
.card.pressed{
    background:#381A6B;
    color:white;
}

.num{
    position:absolute;
    top:16px;
    left:22px;
    font-size:.9rem;
    letter-spacing:2px;
}

.card h3{
    font-size:1.5rem;
    line-height:1.35;
    margin-bottom:12px;
}

.card p{
    font-size:1.05rem;
    line-height:1.4;
}

@media(max-width:1100px){
    .grid{ grid-template-columns:repeat(2,1fr); }
}

@media(max-width:700px){
    body{ padding:30px 18px 60px; }
    .grid{ grid-template-columns:1fr; gap:20px; }
    .header h1{ font-size:2.2rem; }
    .header .en-title{ font-size:1.1rem; }
    .card{ min-height:160px; }
    .card h3{ font-size:1.3rem; }
}
</style>
</head>

<body>

<a class="back" href="../index.html">← BOOSTER LINGÜÍSTICO</a>

<div class="header">
    <h1>FRASES CLAVE DEL SECTOR</h1>
    <div class="en-title">SECTOR KEY PHRASES</div>
    <div class="subtitle">
        MARKETING DIGITAL • ENGLISH + ESPAÑOL • BY XPAÑOL
    </div>
</div>

<div class="grid" id="grid"></div>

<script>
/* Para activar una situacion: escribe su archivo en "href" (por ejemplo "situacion-01.html").
   Mientras href sea null, la tarjeta solo hace el efecto de clic. */
const situations = [
    { es: "EVALUAR RESULTADOS",              en: "EVALUATING RESULTS",           href: null },
    { es: "PROPONER UNA SOLUCIÓN",           en: "PROPOSING A SOLUTION",         href: null },
    { es: "EXPLICAR LAS CAUSAS",             en: "EXPLAIN THE CAUSES",           href: null },
    { es: "ANALIZAR LOS DATOS",              en: "ANALYSING THE DATA",           href: null },
    { es: "REVISAR UNA CAMPAÑA",             en: "REVIEWING A CAMPAIGN",         href: null },
    { es: "DAR FEEDBACK",                    en: "GIVING FEEDBACK",              href: null },
    { es: "DISCREPAR CON UN CLIENTE",        en: "DISAGREEING WITH A CLIENT",    href: null },
    { es: "GESTIONAR LAS EXPECTATIVAS",      en: "MANAGING EXPECTATIONS",        href: null },
    { es: "PEDIR MÁS TIEMPO",                en: "ASKING FOR MORE TIME",         href: null },
    { es: "GESTIONAR UN CAMBIO DE ÚLTIMA HORA", en: "HANDLING A LAST-MINUTE CHANGE", href: null },
    { es: "JUSTIFICAR UNA DECISIÓN",         en: "JUSTIFYING A DECISION",        href: null },
    { es: "CERRAR UNA CONVERSACIÓN",         en: "WRAPPING THINGS UP",           href: null }
];

const grid = document.getElementById("grid");

situations.forEach((s, i) => {
    const card = document.createElement(s.href ? "a" : "div");
    card.className = "card";
    if (s.href) card.href = s.href;
    card.innerHTML = `
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
        <h3>${s.es}</h3>
        <p>${s.en}</p>
    `;

    card.addEventListener("click", e => {
        card.classList.add("pressed");
        if (s.href) {
            e.preventDefault();
            setTimeout(() => { window.location.href = s.href; }, 350);
        } else {
            setTimeout(() => card.classList.remove("pressed"), 600);
        }
    });

    grid.appendChild(card);
});

window.addEventListener("pageshow", () => {
    document.querySelectorAll(".card.pressed").forEach(c => c.classList.remove("pressed"));
});
</script>

</body>
</html>
