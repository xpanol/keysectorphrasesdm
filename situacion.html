<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRASES CLAVE | XPAÑOL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Special Elite',cursive}

body{
    min-height:100vh;
    background:#7c3aed;
    color:white;
    padding:40px 30px 70px;
    position:relative;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    pointer-events:none;
    z-index:0;
}

.back,.header,.list{position:relative;z-index:1}

.back{
    display:inline-block;
    color:white;
    text-decoration:none;
    font-size:.85rem;
    letter-spacing:1.5px;
    opacity:.8;
    margin-bottom:35px;
}
.back:hover{opacity:1}

.header{text-align:center;margin-bottom:55px}
.header h1{font-size:3rem;margin-bottom:12px;letter-spacing:2px;line-height:1.25}
.header .en-title{font-size:1.4rem;letter-spacing:3px}

.list{max-width:900px;margin:auto;display:grid;gap:18px}

.video{
    border-radius:24px;
    overflow:hidden;
    background:#000;
    aspect-ratio:16/9;
    box-shadow:0 15px 35px rgba(0,0,0,.18);
}
.video iframe,.video video{width:100%;height:100%;border:0;display:block}

.phrase{
    background:white;
    color:#111;
    border-radius:24px;
    padding:26px 30px;
    box-shadow:0 15px 35px rgba(0,0,0,.18);
}
.phrase .es,.phrase .en{font-size:1.25rem;line-height:1.5}
.phrase .es{margin-bottom:8px}

@media(max-width:700px){
    body{padding:30px 18px 60px}
    .header h1{font-size:2rem}
    .header .en-title{font-size:1.1rem}
    .phrase{padding:22px 20px}
    .phrase .es,.phrase .en{font-size:1.15rem}
}
</style>
</head>

<body>

<a class="back" href="index.html">← FRASES CLAVE DEL SECTOR</a>

<div class="header">
    <h1 id="title-es"></h1>
    <div class="en-title" id="title-en"></div>
</div>

<div class="list" id="list"></div>

<script src="loader.js"></script>
<script>
const id = Number(new URLSearchParams(location.search).get("id"));
const titleEs = document.getElementById("title-es");
const titleEn = document.getElementById("title-en");
const list = document.getElementById("list");

function buildVideo(url) {
    const box = document.createElement("div");
    box.className = "video";
    let m, el;

    if ((m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))) {
        el = document.createElement("iframe");
        el.src = "https://www.youtube-nocookie.com/embed/" + m[1] + "?rel=0";
        el.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
        el.allowFullscreen = true;
    } else if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/))) {
        el = document.createElement("iframe");
        el.src = "https://player.vimeo.com/video/" + m[1];
        el.allow = "autoplay; fullscreen; picture-in-picture";
        el.allowFullscreen = true;
    } else if ((m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) {
        el = document.createElement("iframe");
        el.src = "https://drive.google.com/file/d/" + m[1] + "/preview";
        el.allow = "autoplay; fullscreen";
        el.allowFullscreen = true;
    } else if (/\.(mp4|webm|ogg)(\?.*)?$/i.test(url)) {
        el = document.createElement("video");
        el.src = url;
        el.controls = true;
        el.playsInline = true;
        el.preload = "metadata";
    } else {
        el = document.createElement("iframe");
        el.src = url;
        el.allowFullscreen = true;
    }

    el.title = "Video";
    box.appendChild(el);
    return box;
}

loadSituations().then(situations => {
    const situation = situations.find(s => s.id === id);

    if (!situation) {
        titleEs.textContent = "SITUACIÓN NO ENCONTRADA";
        titleEn.textContent = "SITUATION NOT FOUND";
        return;
    }

    document.title = situation.es + " | XPAÑOL";
    titleEs.textContent = situation.es;
    titleEn.textContent = situation.en;

    if (situation.video) list.appendChild(buildVideo(situation.video));

    situation.phrases.forEach(ph => {
        const card = document.createElement("div");
        card.className = "phrase";

        const es = document.createElement("p");
        es.className = "es";
        es.textContent = ph.es;

        const en = document.createElement("p");
        en.className = "en";
        en.textContent = ph.en;

        card.append(es, en);
        list.appendChild(card);
    });
}).catch(() => {
    titleEs.textContent = "NO SE PUDO CARGAR frases.txt";
    titleEn.textContent = "Open the page from a server (GitHub Pages or Live Server)";
});
</script>

</body>
</html>
